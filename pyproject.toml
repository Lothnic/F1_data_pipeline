[project]
name = "f1"
version = "0.1.0"
description = "Explore FastF1 race data and extract sessions to Parquet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.38.35",
    "fastf1>=3.5.3",
    "google-cloud-storage>=3.1.0",
    "matplotlib>=3.10.3",
    "pandas>=2.3.0",
    "pyarrow>=20.0.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "scikit-learn>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
